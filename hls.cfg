# HLS configuration for the GEMM kernel (Vitis 2025.1 config-file flow).
# Consumed by:  vitis-run --mode hls --csim/--cosim  and  v++ -c --mode hls
# Paths are relative to this file's directory (run the tools from here).
#
# TODO: Part 1 is pure-C, no HLS needed. This is prep for whenever the
# project calls for synthesizing the GEMM kernel to hardware — src/gemm_kernel.cpp
# and test/gemm_kernel_tb.cpp don't exist yet, so csim/csynth will fail until
# they're written (an HLS-friendly C++ rewrite of student_gemm, plus a
# testbench). Until then, use scripts/test_gemm.sh for correctness/perf.

part=xcu50-fsvh2104-2-e

[hls]
flow_target=vitis
syn.top=gemm_kernel
syn.file=src/gemm_kernel.cpp
syn.cflags=-Isrc
tb.file=test/gemm_kernel_tb.cpp
tb.cflags=-Isrc

clock=3.3ns
clock_uncertainty=15%

# Add optimization directives below this line as the course progresses.
